<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LaptopLift{% endblock %} | Student Laptop Sale</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="{{ url_for('home') }}">Laptop<span>Lift</span></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <nav id="mainNav" class="main-nav" aria-label="Main">
        <a href="{{ url_for('home') }}" class="{{ 'active' if active == 'home' }}">Home</a>
        <a href="{{ url_for('offers') }}" class="{{ 'active' if active == 'offers' }}">Offers</a>
        <a href="{{ url_for('about') }}" class="{{ 'active' if active == 'about' }}">About</a>
        <a href="{{ url_for('contact') }}" class="{{ 'active' if active == 'contact' }}">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 LaptopLift. A practice campaign website.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
